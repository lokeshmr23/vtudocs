# Render blueprint for the app folder — kept in sync with the copy at the repo root,
# which is the one Render actually reads (see the comment block there).
# Free tier: spins down after ~15 min idle; disk is EPHEMERAL, so the app re-seeds
# its library on every cold boot (VTUDOCS_EPHEMERAL) from ./library + ./cover-art.
services:
  - type: web
    name: vtudocs
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: VTUDOCS_EPHEMERAL
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12"
      # Optional Google sign-in — see GOOGLE-SIGNIN.md
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
      # - key: GOOGLE_CLIENT_SECRET
      #   sync: false
      # Optional fixed signing key so sessions survive cold restarts
      # - key: VTUDOCS_SECRET
      #   generateValue: true
